name: Search Console report

on:
  schedule:
    - cron: "19 8 * * 3"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: search-console-report
  cancel-in-progress: true

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Check configuration
        id: configuration
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICE_ACCOUNT_JSON" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            printf '## Search Console report\n\nConfiguration is pending; add the `GOOGLE_SERVICE_ACCOUNT_JSON` repository secret.\n' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build Search Console report
        if: steps.configuration.outputs.configured == 'true'
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SEARCH_CONSOLE_SITE_URL: ${{ vars.SEARCH_CONSOLE_SITE_URL || 'sc-domain:armeltenkiang.com' }}
          SEARCH_CONSOLE_QUERY: "Armel Tenkiang"
          SEARCH_CONSOLE_REPORT_PATH: /tmp/search-console-report.json
        run: node scripts/search-console-report.mjs

      - name: Upload private report artifact
        if: steps.configuration.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: search-console-report
          path: /tmp/search-console-report.json
          retention-days: 90
