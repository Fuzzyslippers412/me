name: Check live search surface

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/search-surface-health.yml"
      - "data/site.json"
      - "data/projects.json"
      - "data/research-outputs.json"
      - "scripts/check-live-site.mjs"
      - "scripts/audit-search-surface.mjs"
      - "scripts/validate-site.mjs"
      - "**/*.html"
      - "robots.txt"
      - "sitemap.xml"
      - "favicon-48.png"
  schedule:
    - cron: "43 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-search-surface
  cancel-in-progress: true

jobs:
  verify-live-files:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Audit generated search surface
        run: |
          node scripts/build-authority-assets.mjs
          node scripts/build-research-assets.mjs
          node scripts/validate-site.mjs
          node scripts/audit-search-surface.mjs --strict --json /tmp/search-surface-report.json

      - name: Upload search-surface report
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: search-surface-report
          path: /tmp/search-surface-report.json
          retention-days: 30

      - name: Wait for Pages and verify the live site
        env:
          LIVE_CHECK_ATTEMPTS: "10"
          LIVE_CHECK_DELAY_MS: "45000"
        run: node scripts/check-live-site.mjs
