name: Check live search surface

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/search-surface-health.yml"
      - "data/site.json"
      - "scripts/check-live-site.mjs"
      - "**/*.html"
      - "robots.txt"
      - "sitemap.xml"
      - "favicon-48.png"
  schedule:
    - cron: "43 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-search-surface
  cancel-in-progress: true

jobs:
  verify-live-files:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Wait for Pages and verify the live site
        env:
          LIVE_CHECK_ATTEMPTS: "10"
          LIVE_CHECK_DELAY_MS: "45000"
        run: node scripts/check-live-site.mjs
