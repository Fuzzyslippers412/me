name: Update project feeds

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-updates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build updates
        env:
          GITHUB_PROFILE_TOKEN: ${{ secrets.GH_STATS_TOKEN }}
          GH_STATS_TOKEN: ${{ secrets.GH_STATS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GH_STATS_TOKEN || secrets.GITHUB_TOKEN }}
        run: node scripts/build-updates.mjs

      - name: Render static snapshots
        run: |
          node scripts/render-static-data.mjs
          node scripts/build-sitemap.mjs
          node scripts/validate-site.mjs

      - name: Commit and push if changed
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/updates.json data/profile.json sitemap.xml \
              index.html en/index.html fr/index.html pt/index.html \
              about/index.html en/about/index.html fr/about/index.html pt/about/index.html \
              updates/index.html
            git commit -m "Refresh verified project activity"
            git push
          else
            echo "No updates to commit."
          fi
