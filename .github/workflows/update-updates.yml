name: Update project feeds

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-updates.yml"
      - "data/expertise.json"
      - "data/projects.json"
      - "data/research-outputs.json"
      - "data/sources.json"
      - "data/update-notes.json"
      - "scripts/**"
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-project-feeds
  cancel-in-progress: false

jobs:
  build-updates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Build updates
        env:
          GITHUB_PROFILE_TOKEN: ${{ secrets.GH_STATS_TOKEN }}
          GH_STATS_TOKEN: ${{ secrets.GH_STATS_TOKEN }}
          PROJECTS_READ_TOKEN: ${{ secrets.PROJECTS_READ_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GH_STATS_TOKEN || github.token }}
          REQUIRE_FRESH_PROFILE: "1"
        run: node scripts/build-updates.mjs

      - name: Verify GitHub snapshot freshness
        env:
          PROFILE_MAX_AGE_DAYS: "3"
        run: node scripts/verify-activity-freshness.mjs

      - name: Render static snapshots
        run: |
          node scripts/build-expertise.mjs
          node scripts/build-research-pages.mjs
          node scripts/build-update-pages.mjs
          node scripts/build-update-indexes.mjs
          node scripts/build-feed.mjs
          node scripts/build-authority-assets.mjs
          node scripts/build-research-assets.mjs
          node scripts/enhance-html.mjs
          node scripts/render-static-data.mjs
          node scripts/build-sitemap.mjs
          node scripts/validate-site.mjs

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/updates.json data/profile.json feed.xml sitemap.xml updates/ authority/ \
            index.html en/index.html fr/index.html pt/index.html \
            about/index.html en/about/index.html fr/about/index.html pt/about/index.html \
            projects/ en/projects/ fr/projects/ pt/projects/ \
            research/ en/research/ fr/research/ pt/research/ \
            it/updates/ fr/updates/ pt/updates/

          if git diff --cached --quiet; then
            echo "No updates to commit."
            exit 0
          fi

          git commit -m "Refresh verified project activity"
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push attempt ${attempt} raced with another update; retrying."
          done
          echo "Unable to push after three non-force retries."
          exit 1
